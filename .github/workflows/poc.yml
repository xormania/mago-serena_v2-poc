name: Pinned Serena + Mago PoC
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build exact toolchain
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: mago-serena-poc:local
          cache-from: type=gha,scope=mago-serena-${{ hashFiles('Dockerfile', 'toolchain.lock.json', 'uv.lock', 'adapter/**') }}
          cache-to: type=gha,mode=max,scope=mago-serena-${{ hashFiles('Dockerfile', 'toolchain.lock.json', 'uv.lock', 'adapter/**') }}
      - name: Real Docker, original application tests and MCP acceptance
        run: ./bin/poc test
      - name: Retain all evidence, including failed scenarios
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: poc-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
