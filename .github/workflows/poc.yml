name: Pinned Serena + Mago PoC
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR updates replace only that PR's acceptance; master and other refs are separate.
  group: poc-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        id: uv
        with:
          version: '0.12.8'
      - name: Install locked fast-test environment
        id: dependencies
        run: python3 tools/ci/capture_step.py run --step dependencies -- uv sync --frozen --python 3.12.12
      - name: Fast properties, manifest verification and mocked diagnosis
        id: fast
        run: python3 tools/ci/capture_step.py run --step fast -- ./bin/poc fast
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, Node 24
        id: builder
      # CLI builds need the action-context cache credentials. This local Node24
      # action exports an allowlist without logging credential values.
      - uses: ./.github/actions/cache-runtime
        id: cache_runtime
      - name: Build exact toolchain
        id: build
        run: python3 tools/ci/capture_step.py run --step build -- python3 tools/ci/build_image.py
      - name: Real Docker, original application tests and MCP acceptance
        id: acceptance
        run: python3 tools/ci/capture_step.py run --step acceptance -- ./bin/poc test
      - name: Collect bounded advisory diagnosis data
        if: always()
        id: collect
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: python3 tools/ci/capture_step.py collect
      - name: Upload diagnosis data without credentials
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: jev-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/jev-input/diagnosis-input.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain all evidence, including failed scenarios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: poc-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
